services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: countersign
      POSTGRES_DB: countersign
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://countersign:countersign@db:5432/countersign
    ports: ["8000:8000"]

volumes:
  pgdata:
