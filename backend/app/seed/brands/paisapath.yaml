  - {code: P-F04, statement: PaisaPath Plus costs ₹79 per month., owner: Commercial, source_document: Pricing page 2025, products: [PaisaPath Plus], superseded_by: P-F03}
  - {code: P-F05, statement: PaisaPath is an education app and does not sell or execute investments., owner: Legal, source_document: Terms of use}
