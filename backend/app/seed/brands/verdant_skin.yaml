# Verdant Skin: fictional personal-care brand used for the demo sandbox and evaluation.
# All products, facts, studies and people are invented.
key: verdant_skin
seed_version: 4
name: Verdant Skin
region: IN
users:
  - {role: admin, name: Asha Menon, email: asha@verdant.example}
  - {role: reviewer, name: Vikram Rao, email: vikram@verdant.example}
  - {role: creator, name: Riya Sharma, email: riya@verdant.example}

rules:
  - code: R01
    type: terminology
    severity: warning
    title: Brand name
    description: Write the brand as "Verdant Skin" (two words). Hashtags are exempt.
    params: {preferred: Verdant Skin, forbidden: [Verdent Skin]}
  - code: R02
    type: terminology
    severity: blocking
    title: ClearDew product name
    description: The serum is "ClearDew", one word, capital C and D.
    params: {preferred: ClearDew, forbidden: [Clear-Dew]}
  - code: R03
    type: terminology
    severity: blocking
    title: AloeCalm product name
    description: The gel is "AloeCalm", one word, capital A and C.
    params: {preferred: AloeCalm, forbidden: [Aloe-Calm, Aloe Calm]}
  - code: R04
    type: banned_phrase
    severity: blocking
    title: Hype and absolute promises
    description: Cosmetics cannot promise guaranteed or instant outcomes.
    params: {phrases: [guaranteed results, miracle, 100% guaranteed, instant results, no side effects, risk-free]}
  - code: R05
    type: banned_phrase
    severity: warning
    title: Say "age-care", not "anti-ageing"
    description: House style avoids framing ageing as a problem.
    params: {phrases: [anti-ageing, anti-aging], alternative: age-care}
  - code: R06
    type: required_phrase
    severity: blocking
    title: Offers need "T&C apply"
    description: Any discount, offer or free item must carry "T&C apply"
    params: {text: "T&C apply", trigger: '\d+\s?%\s?off|\bdiscount|\boffer\b|\bsale\b|\bcashback|(?<![\w-])free\b(?![- ]from)'}
  - code: R07
    type: punctuation_limit
    severity: warning
    title: One exclamation mark per post
    description: At most one "!" per draft and never "!!".
    params: {char: "!", max_per_draft: 1, max_run: 1}
  - code: R08
    type: length_limit
    severity: blocking
    title: Channel length limits
    description: The highlighted text is past the channel limit.
    params:
      limits:
        x: {max_chars: 280}
        instagram: {max_chars: 2200}
        linkedin: {max_chars: 3000}
        ad: {max_chars: 150}
  - code: R09
    type: readability
    severity: warning
    title: Easy to read
    description: Keep sentences under 30 words and the copy at Flesch 40 or above.
    params: {max_sentence_words: 30, min_flesch: 40}
  - code: R10
    type: all_caps
    severity: warning
    title: No shouting
    description: Avoid words in all capitals (product acronyms are fine).
    params: {allow: [SPF, UVA, UVB, AHA, BHA, FAQ, PETA, INR], min_length: 4}
  - code: R11
    type: hashtag
    severity: warning
    title: Hashtags
    description: At most 5 hashtags, and social posts carry #VerdantSkin.
    channels: [instagram, x, linkedin]
    params: {max_count: 5, required: ["#VerdantSkin"]}
  - code: R12
    type: regex
    severity: info
    title: Use the % sign
    description: Write "20%", not "20 per cent".
    params:
      pattern: '\b(\d+(?:\.\d+)?)\s?per\s?cent\b'
      flags: i
      message: Use the % sign
      replacement: '\1%'
      should_match: ["20 per cent", "15 percent"]
      should_not_match: ["percentage points"]
  - code: R13
    type: currency_format
    severity: warning
    title: Rupee symbol
    description: Write prices as ₹699, not Rs. 699 or INR 699.
    params: {symbol: "₹"}
  - code: R14
    type: banned_phrase
    severity: blocking
    title: No medical claims
    description: Cosmetics may not claim to cure or treat a condition (Drugs and Magic Remedies Act).
    params: {phrases: [cures acne, cure acne, treats eczema, heals scars, cures pigmentation]}

voice:
  - code: V1
    title: Calm, not hype
    description: Confident and quiet. No pressure tactics, countdowns or stacked exclamation marks.
    good: ["A gentle gel for skin that has had a long day."]
    bad: ["INSANE results!!! Grab it NOW before it's GONE!!!"]
  - code: V2
    title: Clinically honest
    description: Say what a study showed, with its size and timeframe. Never round up results.
    good: ["In a four-week study, 68% of participants saw fewer visible blemishes."]
    bad: ["Science-backed miracle for flawless skin."]
  - code: V3
    title: Warm second person
    description: Talk to "you" in short, friendly sentences.
    good: ["Your skin, a little calmer by Friday."]
    bad: ["Consumers seeking dermal tranquillity may consider this formulation."]
  - code: V4
    title: Skin-positive
    description: No shaming. Avoid "flawless", "fix your skin", "fairness" and "imperfections".
    good: ["Care for the skin you have."]
    bad: ["Fix your flawed skin and get a flawless, fairer look."]

palette:
  - {name: Ink, hex: "#1B1F1D", role: text}
  - {name: Leaf Green, hex: "#2F6B4F", role: accent}
  - {name: Aloe, hex: "#9BC4A8", role: accent}
  - {name: Clay, hex: "#C46A4A", role: accent}
  - {name: Cream, hex: "#FAF7F0", role: background}
  - {name: White, hex: "#FFFFFF", role: background}

