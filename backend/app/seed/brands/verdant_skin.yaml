# The Round 1 worked example (Round 1 PDF §4.1), loaded by the "Load the Round 1 example" button.
sample:
  title: AloeCalm launch caption
  channel: instagram
  purpose: Announce the AloeCalm launch to followers
  text: "Meet the new Aloe-Calm gel: 100% natural and clinically proven to clear acne in just 7 days!!! Free delivery on every order, this week only."

# Pre-built drafts so no screen in a fresh sandbox is ever empty.
drafts:
  - title: ClearDew product page blurb
    channel: product_page
    purpose: Describe ClearDew Serum on its product page
    author: creator
    versions:
      - "Meet Clear-Dew, the serum that gives you FLAWLESS skin. Rs. 599 for 30 ml!!"
      - "ClearDew Serum brings 2% niacinamide to your evening routine. In an eight-week study of 80 adults, 74% reported more even-looking skin tone. Fragrance-free, ₹699 for 30 ml."
    flow:
      - {decision: submitted, by: creator}
      - {decision: approved, by: reviewer, reason: "Claims match F-30, F-31 and F-32.", claims_reviewed: true}
    final_status: approved
  - title: Monsoon skincare newsletter
    channel: email
    purpose: Remind subscribers how to care for skin in humid weather
    author: creator
    versions:
      - "Humid days call for lighter layers. AloeCalm absorbs into skin in under 30 seconds, so it sits comfortably under sunscreen. Every Verdant Skin product is cruelty-free and free from parabens. Shipping is free on orders above ₹499 within India. T&C apply."
    flow:
      - {decision: submitted, by: creator}
    final_status: in_review
  - title: ClearDew results post
    channel: linkedin
    purpose: Share ClearDew study results with the professional community
    author: creator
    versions:
      - "Our ClearDew Serum is the best niacinamide serum in India. Most users see brighter skin within days. #VerdantSkin #Skincare"
    flow:
      - {decision: submitted, by: creator}
      - {decision: changes_requested, by: reviewer, reason: "Use the study numbers from F-31 and drop 'best in India' unless we have a source."}
    comments:
      - {by: reviewer, body: "Please cite the study size and timeframe, the way F-31 states it."}
    final_status: changes_requested
  - title: Bottle sustainability post
    channel: instagram
    purpose: Tell followers about AloeCalm's recycled packaging
    author: creator
    versions:
      - "Our AloeCalm bottles are made with 100% recycled plastic. Small steps for a greener shelf. #VerdantSkin"
    flow: []
    final_status: checked
