# Kheti Crunch: fictional food and nutrition brand (evaluation only). All facts are invented.
key: kheti_crunch
seed_version: 1
name: Kheti Crunch
region: IN
users:
  - {role: admin, name: Meera Iyer, email: meera@kheti.example}
  - {role: reviewer, name: Arjun Das, email: arjun@kheti.example}
  - {role: creator, name: Sana Khan, email: sana@kheti.example}

rules:
  - {code: K01, type: terminology, severity: blocking, title: Product name, description: 'The bar is "MilletMunch", one word.', params: {preferred: MilletMunch, forbidden: [Millet Munch, Millet-Munch]}}
  - {code: K02, type: terminology, severity: warning, title: Brand name, description: 'Write "Kheti Crunch" as two words.', params: {preferred: Kheti Crunch, forbidden: [Khetti Crunch]}}
  - {code: K03, type: banned_phrase, severity: blocking, title: Health promises, description: Foods cannot claim to cure, prevent or treat disease (FSSAI advertising rules)., params: {phrases: [cures diabetes, prevents diabetes, burns fat, detox, boosts immunity, weight loss guaranteed]}}
  - {code: K04, type: banned_phrase, severity: warning, title: Vague purity words, description: Avoid "pure" and "chemical-free"; every food is made of chemicals., params: {phrases: [chemical-free, 100% pure], alternative: made with simple ingredients}}
  - {code: K05, type: required_phrase, severity: blocking, title: Offers need T&C, description: Discounts and free items need "T&C apply", params: {text: T&C apply, trigger: '\d+\s?%\s?off|\bdiscount|\boffer\b|(?<![\w-])free\b(?![- ]from)|\bbogo\b'}}
  - {code: K06, type: punctuation_limit, severity: warning, title: Exclamation marks, description: 'Up to two "!" per post, never doubled.', params: {char: "!", max_per_draft: 2, max_run: 1}}
  - {code: K07, type: length_limit, severity: blocking, title: Channel limits, description: Past the channel limit., params: {limits: {x: {max_chars: 280}, ad: {max_chars: 125}}}}
  - {code: K08, type: all_caps, severity: warning, title: No shouting, description: Avoid all-caps words., params: {allow: [FSSAI, BOGO], min_length: 4}}
  - {code: K09, type: hashtag, severity: warning, title: Hashtags, description: "At most 4 hashtags; include #KhetiCrunch.", channels: [instagram, x], params: {max_count: 4, required: ["#KhetiCrunch"]}}
  - {code: K10, type: currency_format, severity: warning, title: Rupee symbol, description: Use ₹., params: {symbol: "₹"}}
  - {code: K11, type: regex, severity: warning, title: Grams unit, description: 'Write "10 g", not "10gms".', params: {pattern: '\b(\d+)\s?gms?\b', flags: i, message: 'Write grams as "g"', replacement: '\1 g', should_match: ["10gms", "12 gm"], should_not_match: ["gym"]}}
  - {code: K12, type: readability, severity: warning, title: Short sentences, description: Under 25 words per sentence., params: {max_sentence_words: 25}}

voice:
  - {code: V1, title: Warm and playful, description: "Friendly, light puns welcome, never preachy.", good: ["Snack o'clock, sorted."], bad: ["Consume this nutritional product daily."]}
  - {code: V2, title: Honest nutrition, description: State nutrition facts per serving, without diet-culture language., good: ["10 g protein per bar."], bad: ["Guilt-free snacking for a bikini body."]}
  - {code: V3, title: Farm-proud, description: Credit the farmers and grains plainly., good: ["Made with ragi grown in Karnataka."], bad: ["Ancient superfood magic."]}

palette:
  - {name: Soil, hex: "#4A3426", role: text}
  - {name: Ragi, hex: "#B5562F", role: accent}
  - {name: Husk, hex: "#F3E7D3", role: background}

