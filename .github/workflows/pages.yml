name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # fork PRs get no secrets, so they cannot deploy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      # main -> production; PR n -> branch alias pr-n.<project>.pages.dev, which the Pages Function
      # routes to Render's PR n preview
      BRANCH: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # run from frontend/ so wrangler bundles frontend/functions alongside dist/
      - run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request.number;
            const url = `https://pr-${n}.${process.env.PROJECT}.pages.dev`;
            const marker = "<!-- pages-preview -->";
            const body = `${marker}\n**Preview:** ${url}\nAPI: Render PR preview for #${n} (cold start can take ~1 min).`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: n });
            const old = comments.find(c => c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });
